<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">AI Analyzer</div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('grammar') }}">Grammar</a>
        <a href="{{ url_for('speech') }}">Speech</a>
    </nav>
</header>

<section class="hero">
    <h1>Speech Analyzer</h1>
    <p>Upload audio file for pronunciation analysis</p>
</section>

<section class="main">

    <div class="card full-width">

        <h2>Upload Audio</h2>

        <input type="file" id="audioInput" accept="audio/*">

        <button class="btn" onclick="analyzeSpeech()">Analyze Speech</button>

       
   <div class="output-wrapper">

           <h3>Original Sentence</h3>
<div id="originalText" class="output-box"></div>

<h3>Corrected Sentence</h3>
<div id="correctedText" class="output-box"></div>

<h3>AI Suggestion</h3>
<div id="aiSuggestion" class="output-box"></div>
<div class="style-card">
    <h3>Professional</h3>
    <p id="professional"></p>
</div>

<div class="style-card">
    <h3>Formal</h3>
    <p id="formal"></p>
</div>

<div class="style-card">
    <h3>Friendly</h3>
    <p id="friendly"></p>
</div>

<div class="style-card">
    <h3>Concise</h3>
    <p id="concise"></p>
</div>

<div class="style-card">
    <h3>Advanced</h3>
    <p id="advanced"></p>
</div>
        </div>

</div>

</section>

<footer>
    <p>© 2026 AI Analyzer</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
