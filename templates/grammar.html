<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Checker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">AI Analyzer</div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('grammar') }}">Grammar</a>
        <a href="{{ url_for('speech') }}">Speech</a>
    </nav>
</header>

<section class="hero">
    <h1>Grammar Checker</h1>
    <p>Check and correct your sentences using AI</p>
</section>

<section class="main">

    <div class="card full-width">

        <h2>Enter Your Text</h2>

        <textarea id="grammarInput" placeholder="Type your sentence here..."></textarea>

        <button class="btn" onclick="checkGrammar()">Check Grammar</button>

        <div class="output-wrapper">

           <h3>Original Sentence</h3>
<div id="originalText" class="output-box"></div>

<h3>Corrected Sentence</h3>
<div id="correctedText" class="output-box"></div>

<h3>AI Suggestion</h3>
<div id="aiSuggestion" class="output-box"></div>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 AI Analyzer</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
